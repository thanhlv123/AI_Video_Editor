name: M116 Release Gate

on:
  workflow_dispatch:
  push:
    branches:
      - "creator-studio-m*"

permissions:
  contents: read

concurrency:
  group: creator-studio-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release-gate:
    name: Windows deterministic test gate
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      QT_QPA_PLATFORM: "offscreen"
      YOUTUBE_API_KEY: ""
      PEXELS_API_KEY: ""
      PIXABAY_API_KEY: ""
      KIE_API_KEY: ""
      OPENAI_API_KEY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version | Select-Object -First 1

      - name: Compile production Python
        shell: pwsh
        run: python scripts/m116_release_gate.py compile --report .automation/compile.json

      - name: Import-only discovery gate
        shell: pwsh
        run: python scripts/m116_release_gate.py import --report .automation/import.json

      - name: M117 production launcher prerequisites
        shell: pwsh
        run: python run_creator_studio.py --check

      - name: M117 offscreen production GUI smoke
        shell: pwsh
        timeout-minutes: 3
        run: python run_creator_studio.py --smoke

      - name: M118 real offline FFmpeg acceptance
        shell: pwsh
        timeout-minutes: 4
        run: python scripts/m118_render_acceptance.py --report .automation/m118_acceptance.json

      - name: M125 real FFmpeg failure and recovery acceptance
        shell: pwsh
        timeout-minutes: 4
        run: python scripts/m125_render_failure_recovery.py --report .automation/m125_acceptance.json

      - name: M126 real MP4 integrity acceptance
        shell: pwsh
        timeout-minutes: 4
        run: python scripts/m126_output_integrity_acceptance.py --report .automation/m126_acceptance.json

      - name: M127 interrupted export recovery acceptance
        shell: pwsh
        timeout-minutes: 4
        run: python scripts/m127_interrupted_export_acceptance.py --report .automation/m127_acceptance.json

      - name: M132 Windows local acceptance
        shell: pwsh
        timeout-minutes: 4
        run: python scripts/m132_windows_local_acceptance.py --ci --report .automation/m132_acceptance.json

      - name: Full automatic unittest suite
        shell: pwsh
        run: python scripts/m116_release_gate.py full --verbosity 1 --report .automation/full.json

      - name: Upload release-gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m116-release-gate-reports
          path: .automation/*.json
          if-no-files-found: warn
          include-hidden-files: true
